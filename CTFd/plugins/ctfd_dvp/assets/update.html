{% extends "admin/challenges/update.html" %}

{% block value %}
    <div class="form-group">
        <label for="git_repo_url">Git-репозиторий с Helm-чартом *</label>
        <input type="text" class="form-control" name="git_repo_url" required 
               value="{{ challenge.git_repo_url }}">
    </div>

    <div class="form-group">
        <label for="git_ref">Ветка / тег</label>
        <input type="text" class="form-control" name="git_ref" value="{{ challenge.git_ref }}">
    </div>

    <div class="form-group">
        <label for="chart_path">Путь к чарту</label>
        <input type="text" class="form-control" name="chart_path" value="{{ challenge.chart_path }}">
    </div>

    <div class="form-group">
        <label for="helm_values">Дополнительные параметры Helm (JSON)</label>
        <textarea class="form-control" name="helm_values" rows="6">{{ challenge.helm_values }}</textarea>
    </div>

    <div class="form-group">
        <label for="timeout">Время жизни (секунд)</label>
        <input type="number" class="form-control" name="timeout" value="{{ challenge.timeout }}">
    </div>

    <div class="form-group">
        <label for="subdomain_template">Шаблон поддомена</label>
        <input type="text" class="form-control" name="subdomain_template" 
               value="{{ challenge.subdomain_template }}">
    </div>

    <div class="form-group">
        <label for="check_script">Скрипт проверки (Bash)</label>
        <textarea class="form-control" name="check_script" rows="6">{{ challenge.check_script }}</textarea>
    </div>

    <div class="form-group">
        <label for="value">Очки *</label>
        <input type="number" class="form-control" name="value" value="{{ challenge.value }}" required>
    </div>
{% endblock %}

{% block type %}
    <input type="hidden" name="type" value="dvp_dynamic" id="chaltype">
{% endblock %}
